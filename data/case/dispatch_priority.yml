- case_name: skip_pp_vs_enforced_match_si # skip vs enforced match -> skip comes first
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.3d_mip.general1.Source_General_TOF3Dmultislabneckswift_3
          mip1: Siemens.3d_mip.general1.MIP_auto_General_MIP Range_100_1
          mip2: Siemens.3d_mip.general1.MIP_auto_General_MIP Range_100_1
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_update:
          DeviceSerialNumber: "111"
          SeriesDescription: siemens_auto_sof_a_mip_sm_skip # for enforced matching
        tag_transform:
          SiemensSeriesName: siemens_auto_sof_a_mip_sm_skip
    - action: dicom_send  # this series should be skipped
      arguments:
        dicom: mip1
        tag_update:
          DeviceSerialNumber: "111"
