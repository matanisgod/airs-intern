        dicom: mip2
        tag_update:
          DeviceSerialNumber: "111"
          ProtocolName: siemens_auto_sof_a_mip_sm_skip
          SeriesDescription: siemens_mip2

#sn, sd enforced wildcard matched -> skip comes first, skip b50 source, b800 & adc as one reconinput
- case_name: skip_pp_vs_regular_match_si
  config:
    - action: dicom_send
      data:
        dicom_source:
          b50: Siemens.dwi.1ADC.55001_DWI AX b50 400 800 Free breath P2
          b400: Siemens.dwi.1ADC.55002_DWI AX b50 400 800 Free breath P2
          b800: Siemens.dwi.1ADC.55003_DWI AX b50 400 800 Free breath P2
          adc: Siemens.dwi.1ADC.56001_DWI AX b50 400 800 Free breath P2_ADC # adc from source b50, b800
  step:
    - action: dicom_send
      arguments:
        dicom: b50
        tag_update:
          DeviceSerialNumber: "111"
          SeriesDescription: siemens_auto_dwi_combined1_sof_a_sm_case5
        tag_transform:
          SiemensSeriesName: siemens_auto_dwi_combined_sof_a_sm_case5
    - action: dicom_send
      arguments:
        dicom: b400
        tag_update:
          DeviceSerialNumber: "111"
          SeriesDescription: siemens_auto_dwi_combined2_sof_a_sm_case5
        tag_transform:
          SiemensSeriesName: siemens_auto_dwi_combined_sof_a_sm_case5
    - action: dicom_send
      arguments:
        dicom: b800
        tag_update:
          DeviceSerialNumber: "111"
          SeriesDescription: siemens_auto_dwi_combined3_sof_a_sm_case5
        tag_transform:
          SiemensSeriesName: siemens_auto_dwi_combined_sof_a_sm_case5
    - action: dicom_send
      arguments:
        dicom: adc #want to skip this adc
        tag_update:
          DeviceSerialNumber: "111"
          SeriesDescription: siemens_11auto_combined_adc_sm_case5
        tag_transform:
          SiemensSeriesName: siemens_auto_dwi_combined_sof_a_sm_case5

