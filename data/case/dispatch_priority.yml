# dcs_setup_data: regression/dispatch_priority.yml

# test the priority of 'wildcard' 'skip' 'enforced' 'regular' matching
# https://www.notion.so/airsmedical/BasicCase-wildcard-12100244011b4a329ad8a9759a017391?pvs=4 (for more descriptions)

#wildcard in source series name
- case_name: wildcard_seriesname_si
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.2d_minip.siemens_xa_2d_pp.2d_source
          mip1: Siemens.2d_minip.siemens_xa_2d_pp.mip_radial
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_update:
          DeviceSerialNumber: "111"
          SeriesDescription: siemens_g1_auto_sof_a_sm_wildcard_auto
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm_wildcard_auto
    - action: dicom_send
      arguments:
        dicom: mip1
        tag_update:
          DeviceSerialNumber: "111"
          ProtocolName: siemens_g1_auto_sof_a_sm_wildcard_auto
          SeriesDescription: mip_wildcard

