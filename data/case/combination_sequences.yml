# dcs_setup_data: smoke/smoke_setting.yml

# study contains various sequences.
# 1. (single source 2 + (source+mpr2) + dwi + swi + notsupported 2)
# 2. ((source+mpr1) + single source 2 + dixon + dwi + not supported 1 + angio)

- case_name: siemens_1
  config:
    - action: dicom_send
      data:
        dicom_source:
          singlesource1: Siemens.2d_minip.siemens_xa_2d_pp.2d_source
          singlesource2: Siemens.3d_mip.2MIP.TOF_3D_multi-slab_WillisMRA_b3b8
          sourcempr_source1: Siemens.3d_mpr.2MPR.9_T1 VIBE AX FS_Multi artery 352
          sourcempr_mpr1: Siemens.3d_mpr.2MPR.104_MPR Range
          sourcempr_mpr2: Siemens.3d_mpr.2MPR.105_MPR Range[1]
          b50: Siemens.dwi.1ADC.55001_DWI AX b50 400 800 Free breath P2
          b400: Siemens.dwi.1ADC.55002_DWI AX b50 400 800 Free breath P2
          b800: Siemens.dwi.1ADC.55003_DWI AX b50 400 800 Free breath P2
          adc: Siemens.dwi.1ADC.56001_DWI AX b50 400 800 Free breath P2_ADC # adc from source b50, b800
          swi_source1: Siemens.swi.auto_parallel_minip2.19001_SWI_Images_e112
          swi_source2: Siemens.swi.auto_parallel_minip2.17001_Mag_Images_192b
          swi_source3: Siemens.swi.auto_parallel_minip2.18001_Pha_Images_d10c
          swi_minip1: Siemens.swi.auto_parallel_minip2.20001_mIP_Images_SW__1e1e # from swi
          ns_source1: Siemens.vibe_dixon.siemens_VE_3d_dixon.fat
          ns_source2: Siemens.vibe_dixon.siemens_VE_3d_dixon.fat_mpr
        tag_update:
          DeviceSerialNumber: "111"
  step:
    - action: dicom_send
      arguments:
        dicom: singlesource1
        tag_update:
          ProtocolName: singlesource
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_swift
    - action: dicom_send
      arguments:
        dicom: singlesource2
        tag_update:
          ProtocolName: singlesource
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_swift
    - action: dicom_send
      arguments:
        dicom: sourcempr_source1
        tag_update:
          ProtocolName: sourcempr
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_swift
    - action: dicom_send
      arguments:
        dicom: sourcempr_mpr1
        tag_transform:
          SiemensSeriesName: mpr
    - action: dicom_send
      arguments:
        dicom: sourcempr_mpr2
        tag_transform:
          SiemensSeriesName: mpr
    - action: dicom_send
      arguments:
        dicom: b50
        tag_transform:
          SiemensSeriesName: siemens_auto_dwi_combined_sof_a_sm
        tag_update:
          SeriesDescription: siemens_auto_dwi_combined1_sof_a_sm
    - action: dicom_send
      arguments:
        dicom: b400
        tag_transform:
          SiemensSeriesName: siemens_auto_dwi_combined_sof_a_sm
        tag_update:
          SeriesDescription: siemens_auto_dwi_combined2_sof_a_sm
    - action: dicom_send
      arguments:
        dicom: b800
        tag_transform:
          SiemensSeriesName: siemens_auto_dwi_combined_sof_a_sm
        tag_update:
          SeriesDescription: siemens_auto_dwi_combined3_sof_a_sm
    - action: dicom_send
      arguments:
        dicom: adc
        tag_transform:
          SiemensSeriesName: siemens_auto_dwi_combined_sof_a_sm
        tag_update:
          SeriesDescription: siemens_auto_combined_adc_sm
    - action: dicom_send
      arguments:
        dicom: swi_source1
        tag_update:
          SeriesDescription: swi
        tag_transform:
          SiemensSeriesName: siemens_swi2
    - action: dicom_send
      arguments:
        dicom: swi_source2
        tag_update:
          SeriesDescription: mag
        tag_transform:
          SiemensSeriesName: siemens_swi2
    - action: dicom_send
      arguments:
        dicom: swi_source3
        tag_update:
          SeriesDescription: pha
        tag_transform:
          SiemensSeriesName: siemens_swi2
    - action: dicom_send
      arguments:
        dicom: swi_minip1
        tag_update:
          SeriesDescription: minip # minip from swi - auto pp matching
        tag_transform:
          SiemensSeriesName: siemens_swi2
    - action: dicom_send
      arguments:
        dicom: ns_source1
        tag_transform:
          SiemensSeriesName: ns_sm
    - action: dicom_send
      arguments:
        dicom: ns_source2
        tag_transform:
          SiemensSeriesName: nsns_sm

