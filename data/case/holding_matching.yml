# dcs_setup_data: smoke/smoke_setting.yml

- case_name: si_2d_sourcemip_holding
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.2d_minip.siemens_xa_2d_pp.2d_source
          mip1: Siemens.2d_minip.siemens_xa_2d_pp.mip_radial
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_update:
          DeviceSerialNumber: "111"
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm
    - action: wait_process_done
    - action: dicom_send
      arguments:
        dicom: mip1
        tag_update:
          DeviceSerialNumber: "111"
          ProtocolName: siemens_g1_auto_sof_a_sm
          SeriesDescription: auto_mip

