########################### etc ###########################
- case_name: stored_multi_dicomae # stored to dicomae 1, 2, 3
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.2d_minip.siemens_xa_2d_pp.2d_source
        uid_vendor: Siemens
        tag_update:
          DeviceSerialNumber: "111"
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_transform:
          SiemensSeriesName: siemens_4_multidicomae

- case_name: series_store_retry_multidicomae # stored to dicomae 1 -> 0, 1, 2
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Philips.2d_source.0pp.301_T2 TSE SAG
        tag_update:
          DeviceSerialNumber: "333"
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_transform:
          SiemensSeriesName: philips_1_swiftmr
    - action: wait_process_done
    - action: dcs_api
      arguments:
        api: series_store_retry
        payload:
          series_index_ids: [0]
          dicomae_ids: [0, 1, 2]

- case_name: job_store_retry_multidicomae # stored to dicomae 1 -> 0, 1, 2
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Philips.2d_source.0pp.301_T2 TSE SAG
        tag_update:
          DeviceSerialNumber: "333"
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_transform:
          SiemensSeriesName: philips_1_swiftmr
    - action: wait_process_done
    - action: dcs_api
      arguments:
        api: job_store_retry
        payload:
          job_index_id: 0
          dicomae_ids: [0, 1, 2]

- case_name: series_entire_retry # store to dicomae 0, 1, 2
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: GE.angio.angio.3D TOF Brain_smft_23
        tag_update:
          DeviceSerialNumber: "222"
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_transform:
          GESeriesName: ge_4_multidicomae
    - action: wait_process_done
    - action: dcs_api
      arguments:
        api: series_retry
        payload:
          series_index_ids: [0]
          series_number_offset: 0

- case_name: job_entire_retry # store to dicomae 0, 1, 2
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: GE.angio.angio.3D TOF Brain_smft_23
        tag_update:
          DeviceSerialNumber: "222"
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_transform:
          GESeriesName: ge_4_multidicomae
    - action: wait_process_done
    - action: dcs_api
      arguments:
        api: job_retry
        payload:
          job_index_id: 0
          series_number_offset: 0
