# setting -> regression/multisource.yaml

############################# Siemens #############################

- case_name: si_dixon_basic_fm # water, fat, in, out, water_mpr, fat_mpr, in_mpr, out_mpr -> all supported
  config:
    - action: dicom_send
      data:
        dicom_source:
          water: Siemens.multiecho.DIXON.C-T-L_SAG_T2_TSE_DFS_3STEP_W_0008
          water_mpr: Siemens.multiecho.DIXON._MPR_RANGE[3]__0106
          fat: Siemens.multiecho.DIXON.C-T-L_SAG_T2_TSE_DFS_3STEP_F_0007
          fat_mpr: Siemens.multiecho.DIXON._MPR_RANGE[2]__0104
          in: Siemens.multiecho.DIXON.C-T-L_SAG_T2_TSE_DFS_3STEP_IN_0006
          in_mpr: Siemens.multiecho.DIXON._MPR_RANGE[1]__0102
          out: Siemens.multiecho.DIXON.C-T-L_SAG_T2_TSE_DFS_3STEP_OPP_0005
          out_mpr: Siemens.multiecho.DIXON._MPR_RANGE__0100
        tag_update:
          DeviceSerialNumber: "111"
  step:
    - action: dicom_send
      arguments:
        dicom: water
        tag_update:
          SeriesDescription: siemens_2d_water_sof_a_waterauto_fm_dsc_sm
        tag_transform:
          SiemensSeriesName: siemens_2d_dixon_sof_a_waterauto_fm_sm
    - action: dicom_send
      arguments:
        dicom: water_mpr
        tag_update:
          SeriesDescription: siemens_2d_water_m_fm_waterauto_sm
        tag_transform:
          SiemensSeriesName: siemens_2d_dixon_sag_a_waterauto_fm_sm
    - action: dicom_send
      arguments:
        dicom: fat
        tag_update:
          SeriesDescription: siemens_2d_fat_sof_a_waterauto_fm_dsc_sm
        tag_transform:
          SiemensSeriesName: siemens_2d_dixon_sof_a_waterauto_fm_sm
    - action: dicom_send
      arguments:
        dicom: fat_mpr
        tag_update:
          SeriesDescription: siemens_2d_fat_m_fm_waterauto_sm
        tag_transform:
          SiemensSeriesName: siemens_2d_dixon_sof_a_waterauto_fm_sm
    - action: dicom_send
      arguments:
        dicom: in
        tag_update:
          SeriesDescription: siemens_2d_in_sof_a_waterauto_fm_dsc_sm
        tag_transform:
          SiemensSeriesName: siemens_2d_dixon_sof_a_waterauto_fm_sm
    - action: dicom_send
      arguments:
        dicom: in_mpr
        tag_update:
          SeriesDescription: siemens_2d_in_m_fm_waterauto_sm
        tag_transform:
          SiemensSeriesName: siemens_2d_dixon_sof_a_waterauto_fm_sm
    - action: dicom_send
      arguments:
        dicom: out
        tag_update:
          SeriesDescription: siemens_2d_out_sof_a_waterauto_fm_dsc_sm
        tag_transform:
          SiemensSeriesName: siemens_2d_dixon_sof_a_waterauto_fm_sm
    - action: dicom_send
      arguments:
        dicom: out_mpr
        tag_update:
          SeriesDescription: siemens_2d_out_m_fm_waterauto_sm
        tag_transform:
          SiemensSeriesName: siemens_2d_dixon_sof_a_waterauto_fm_sm

