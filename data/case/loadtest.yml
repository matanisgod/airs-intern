# dcs_setup_data: smoke/smoke_setting.yml

- case_name: siemens_all_series
  config:
    - action: dicom_send
      data:
        dicom_source:
          s1: Siemens.2d_source.2d_source.many1
          s2: Siemens.2d_source.2d_source.many2
          s3: Siemens.2d_source.2d_source.large1
          s4: Siemens.3d_source.3d_source.many1
          s5: Siemens.3d_source.3d_source.large1
          s6: Siemens.3d_mpr.many1.Source_3D_MANY_PP
          s7: Siemens.3d_mpr.many1._MPR_THICK_RANGE__0100
          s8: Siemens.3d_mpr.many1._MPR_THICK_RANGE[1]__0101
          s9: Siemens.3d_mpr.many1._MPR_THICK_RANGE[2]__0102
        tag_update:
          DeviceSerialNumber: "111"
  step:
    - action: dicom_send
      arguments:
        dicom: s1
        tag_update:
          ProtocolName: siemens_g1_auto_sof_a_sm
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm
    - action: dicom_send
      arguments:
        dicom: s2
        tag_update:
          ProtocolName: siemens_g1_auto_sof_a_sm
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm
    - action: dicom_send
      arguments:
        dicom: s3
        tag_update:
          ProtocolName: siemens_g1_auto_sof_a_sm
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm
    - action: dicom_send
      arguments:
        dicom: s4
        tag_update:
          ProtocolName: siemens_g1_auto_sof_a_sm
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm
    - action: dicom_send
      arguments:
        dicom: s5
        tag_update:
          ProtocolName: siemens_g1_auto_sof_a_sm
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm
    - action: dicom_send
      arguments:
        dicom: s6
        tag_update:
          ProtocolName: siemens_g1_auto_sof_a_sm
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm
    - action: dicom_send
      arguments:
        dicom: s7
        tag_update:
          ProtocolName: auto_pp
    - action: dicom_send
      arguments:
        dicom: s8
        tag_update:
          ProtocolName: auto_pp
    - action: dicom_send
      arguments:
        dicom: s9
        tag_update:
          ProtocolName: auto_pp

