# dcs_setup_data: smoke/smoke_setting.yml

## Siemens contains
# 1. more than one PosDisp
# 2. Series contains PosDisp
# 3. Series contains Navigator
# 4. Collection(1 series instance)
# 5. Collapse -> pacs result is wrong(v3.0.10.0). wating for fixing 2024-12-05

## GE contains
# 1. more than one PosDisp
# 2. Series contains PosDisp
# 3. Series contains Navigator
# 4. Collection(1 series instance)
# 5. Collapse -> pacs result is wrong(v3.0.10.0). wating for fixing 2024-12-05

## Philips contains (no navigator in Philips)
# 1. more than one PosDisp
# 2. Series contains PosDisp
# 3. Collection(1 series instance)
# 5. Collapse -> pacs result is wrong(v3.0.10.0). wating for fixing 2024-12-05
# 5. MIP Collapse

## Not supported
# Siemens
# GE
# Philips

- case_name: siemens_posdisp # not supported. all mark only # TODO: du not mark only
  config:
    - action: dicom_send
      data:
        dicom_source:
          s1: Siemens.2d_source.2d_source.Source_PosDisp_PosDisp 3 pd tse fs AXIknswift
  step:
    - action: dicom_send
      arguments:
        dicom: s1
        tag_update:
          DeviceSerialNumber: "111"
          ProtocolName: siemens_g1_auto_sof_a_swift
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_swift

- case_name: siemens_series_contains_posdisp # supported. 1 mark only
  config:
    - action: dicom_send
      data:
        dicom_source:
          s1: Siemens.2d_minip.siemens_xa_2d_pp.2d_source
  step:
    - action: dicom_send # mark only
      arguments:
        dicom: s1[0:1]
        tag_update:
          DeviceSerialNumber: "111"
          ImageType: "POSDISP"
          ProtocolName: siemens_g1_auto_sof_a_swift
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_swift
    - action: dicom_send # supported
      arguments:
        dicom: s1[1:10]
        tag_update:
          DeviceSerialNumber: "111"
          SeriesDescription: pp
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_swift

- case_name: siemens_series_contains_navigator # supported. 1 mark only
  config:
    - action: dicom_send
      data:
        dicom_source:
          s1: Siemens.what.what.Source_Navigate_HEAD TOF3Daneurysm40swift_1_101159
          s2: Siemens.3d_mip.general3_navigate.MIP_auto_Navigate_MIP Thin Range1_6_101159
  step:
    - action: dicom_send # supported
      arguments:
        dicom: s1
        tag_update:
          DeviceSerialNumber: "111"
          ProtocolName: siemens_g1_auto_sof_a_swift
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_swift
    - action: dicom_send # supported. 1 mark only
      arguments:
        dicom: s2
        tag_update:
          DeviceSerialNumber: "111"
          SeriesDescription: pp
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_swift_pp

- case_name: siemens_collection # not supported. 1 instance series
  config:
    - action: dicom_send
      data:
        dicom_source:
          s1: Siemens.3d_mpr.2MPR.103_MPR Collection
  step:
