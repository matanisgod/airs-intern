# dcs_setup_data: smoke_setting.yml

- case_name: si_3d_3images_only # worker error = recon fail
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.3d_mip.general1.Source_General_TOF3Dmultislabneckswift_3
  step:
    - action: dicom_send
      arguments:
        dicom: source1[0:3]
        tag_update:
          DeviceSerialNumber: "111"
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm

- case_name: si_2d_empty_series_uid # DEAD_LETTER
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.2d_minip.siemens_xa_2d_pp.2d_source
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_update:
          DeviceSerialNumber: "111"
          SeriesInstanceUID: ""
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm

- case_name: si_2d_empty_study_uid # DEAD_LETTER
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.2d_minip.siemens_xa_2d_pp.2d_source
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_update:
          DeviceSerialNumber: "111"
        tag_delete:
          - SOPInstanceUID
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm

- case_name: si_pp_nav_vector_changed # worker error = recon fail
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.2d_minip.siemens_xa_2d_pp.2d_source
          mip1: Siemens.2d_minip.siemens_xa_2d_pp.mip_radial
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_update:
          DeviceSerialNumber: "111"
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm
    - action: dicom_send
      arguments:
        dicom: mip1
        tag_update:
          DeviceSerialNumber: "111"
          ProtocolName: siemens_g1_auto_sof_a_sm
          SeriesDescription: auto_mip
          ImageOrientationPatient: [1, 0, 0, 0, 1, 0]

- case_name: si_nav_instance_order_changed # worker error = recon fail
  config:
    - action: dicom_send
      data:
        dicom_source:
          s1: Siemens.what.what.Source_Navigate_HEAD TOF3Daneurysm40swift_1_101159
          s2: Siemens.3d_mip.general3_navigate.MIP_auto_Navigate_MIP Thin Range1_6_101159
  step:
    - action: dicom_send
      arguments:
        dicom: s1
        tag_update:
          DeviceSerialNumber: "111"
          ProtocolName: siemens_g1_auto_sof_a_swift
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_swift
    - action: dicom_send
      arguments:
        dicom: s2[0:1]
        tag_update:
          DeviceSerialNumber: "111"
          SeriesDescription: pp
          InstanceNumber: 5000
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_swift_pp
    - action: dicom_send
      arguments:
        dicom: s2[1:-1]
        tag_update:
          DeviceSerialNumber: "111"
          SeriesDescription: pp
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_swift_pp
    - action: dicom_send
      arguments:
        dicom: s2[-1:]
        tag_update:
          DeviceSerialNumber: "111"
          SeriesDescription: pp
          InstanceNumber: 1
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_swift_pp

- case_name: si_delete_rows # download fail. DISPATCH_UNIT_NOT_MATCHED
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.multiecho.DIXON.C-T-L_SAG_T2_TSE_DFS_3STEP_OPP_0005
          mpr1: Siemens.multiecho.DIXON._MPR_RANGE__0100
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_update:
          DeviceSerialNumber: "111"
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm
        tag_delete:
          - Rows
    - action: dicom_send
      arguments:
        dicom: mpr1
        tag_update:
          DeviceSerialNumber: "111"
          ProtocolName: siemens_g1_auto_sof_a_sm

- case_name: si_delete_columns # download fail. DISPATCH_UNIT_NOT_MATCHED
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.multiecho.DIXON.C-T-L_SAG_T2_TSE_DFS_3STEP_OPP_0005
          mpr1: Siemens.multiecho.DIXON._MPR_RANGE__0100
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_update:
          DeviceSerialNumber: "111"
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm
        tag_delete:
          - Columns
    - action: dicom_send
      arguments:
        dicom: mpr1
        tag_update:
          DeviceSerialNumber: "111"
          ProtocolName: siemens_g1_auto_sof_a_sm
