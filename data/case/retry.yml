# dcs_setup_data: smoke/smoke_setting.yml

############ series retry - siemens ############
- case_name: siemens_series_retry_offset_0
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.2d_minip.siemens_xa_2d_pp.2d_source
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_update:
          DeviceSerialNumber: "111"
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm
    - action: wait_process_done
    - action: dcs_api
      arguments:
        api: series_retry
        payload:
          series_index_ids: [0]
          series_number_offset: 0

