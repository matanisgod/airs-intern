# uses dcs service setup data: regression/store_retry.yml

################## siemens series store retry ##################
- case_name: si_ssretry_1_defaultae # dicomae 1 -> retry to dicomae 0
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.3d_mip.general1.Source_General_TOF3Dmultislabneckswift_3
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_update:
          DeviceSerialNumber: "111"
        tag_transform:
          SiemensSeriesName: siemens_dicoame1_normal
    - action: wait_process_done
    - action: dcs_api
      arguments:
        api: series_store_retry
        payload:
          series_index_ids: [0]
          dicomae_ids: [0]
