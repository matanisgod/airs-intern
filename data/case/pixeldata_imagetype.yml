# All of dicom files pixel daata or imatge type cheanged have to be mark-only for not sending dicoms to worker.

- case_name: si_2d_source_empty_pixel_data # 10 dicom files mark only
  config:
    - action: dicom_send
      data:
        uid_vendor: Siemens
        dicom_source:
          source1: Siemens.2d_minip.siemens_xa_2d_pp.2d_source
  step:
    - action: dicom_send
      arguments:
        dicom: source1[0:10]
        tag_update:
          DeviceSerialNumber: "111"
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm
    - action: dicom_send # mark only
      arguments:
        dicom: source1[10:20]
        tag_update:
          DeviceSerialNumber: "111"
          PixelData: ""
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm
    - action: dicom_send
      arguments:
        dicom: source1[20:30]
        tag_update:
          DeviceSerialNumber: "111"
        tag_transform:
          SiemensSeriesName: siemens_g1_auto_sof_a_sm

