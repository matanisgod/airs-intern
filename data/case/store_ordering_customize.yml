# # dcs_setup_data: smoke/smoke_setting.yml

# # Basic Case-> vendor * source type * postprocessing type
# # store original false

# ########################### Siemens ###########################
- case_name: sourcepp-si-all
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.2d_minip.siemens_xa_2d_pp.2d_source
          mip1: Siemens.2d_minip.siemens_xa_2d_pp.mip_radial
        uid_vendor: Siemens
        tag_update:
          DeviceSerialNumber: "111"
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_transform:
          SiemensSeriesName: sourcepp-si
        tag_update:
          SeriesDescription: order1
    - action: dicom_send
      arguments:
        dicom: mip1
        tag_update:
          SeriesDescription: order0
- case_name: sourcepp-si-part
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.multiecho.DIXON.C-T-L_SAG_T2_TSE_DFS_3STEP_OPP_0005
        uid_vendor: Siemens
        tag_update:
          DeviceSerialNumber: "111"
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_transform:
          SiemensSeriesName: sourcepp-si
        tag_update:
          SeriesDescription: order1
- case_name: multisource1-si-all
  config:
    - action: dicom_send
      data:
        dicom_source:
          water: Siemens.multiecho.DIXON.C-T-L_SAG_T2_TSE_DFS_3STEP_W_0008
          water_mpr: Siemens.multiecho.DIXON._MPR_RANGE[3]__0106
          in: Siemens.multiecho.DIXON.C-T-L_SAG_T2_TSE_DFS_3STEP_F_0007
          in_mpr: Siemens.multiecho.DIXON._MPR_RANGE[2]__0104
