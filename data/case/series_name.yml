          DeviceSerialNumber: "111"
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_delete:
          - (0x0021, 0x1019) # new_CSA_Header
        tag_update:
          ProtocolName: case3_siemens_g1_auto_sof_a_sm  

