########################### Siemens ###########################
- case_name: si_new_CSA_Header
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.2d_minip.siemens_xa_2d_pp.2d_source
        uid_vendor: Siemens
        tag_update:
          DeviceSerialNumber: "111"
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_transform:  
          Siemens_CSA_new: case1_siemens_g1_auto_sof_a_swift
        
- case_name: si_old_CSA_Header
  config:
    - action: dicom_send
      data:
        dicom_source:
          source1: Siemens.multiecho.DIXON.C-T-L_SAG_T2_TSE_DFS_3STEP_OPP_0005
        uid_vendor: Siemens
        tag_update:
          DeviceSerialNumber: "111"
  step:
    - action: dicom_send
      arguments:
        dicom: source1
        tag_transform:
          Siemens_CSA_old: case2_siemens_g1_auto_sof_a_sm

